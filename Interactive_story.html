<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Onyi Ocean · The... </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: black;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
            color: white;
            line-height: 1.5;
            min-height: 100vh;
            transition: background-color 0.2s ease;
            overflow-x: hidden;
        }

        /* flickering lights — dying bathroom bulb */
        @keyframes flicker {
            0%, 100% { opacity: 1; border-left-color: rgba(255,255,255,0.4); }
            4% { opacity: 0.7; border-left-color: rgba(255,255,255,0.05); }
            10% { opacity: 1; border-left-color: rgba(255,255,255,0.5); }
            22% { opacity: 0.85; border-left-color: rgba(255,255,255,0.1); }
            45% { opacity: 1; border-left-color: rgba(255,255,240,0.3); }
            68% { opacity: 0.9; border-left-color: rgba(200,200,200,0.2); }
        }

        .story-card {
            background: rgba(0, 0, 0, 0.88);
            padding: 1.8rem;
            border-radius: 24px;
            margin: 1.5rem 0;
            border-left: 4px solid white;
            transition: all 0.2s ease;
            animation: flicker 7s infinite;
            backdrop-filter: blur(2px);
        }

        /* screen shake */
        .shake-effect {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            0%,100% { transform: translate(0,0); }
            15% { transform: translate(-6px, -1px) rotate(-0.8deg); }
            30% { transform: translate(5px, 2px) rotate(0.8deg); }
            45% { transform: translate(-3px, -1px); }
            60% { transform: translate(2px, 1px) rotate(0.3deg); }
        }

        /* glitch for entity lines */
        .glitch-text {
            animation: glitchy 0.18s ease-in-out 2;
            color: #c44;
            font-family: monospace;
            text-shadow: -1px 0 red, 1px 0 blue;
            display: inline-block;
        }

        @keyframes glitchy {
            0% { transform: skew(0deg); opacity: 1; letter-spacing: 0px;}
            40% { transform: skew(2deg); opacity: 0.8; letter-spacing: -0.5px;}
            100% { transform: skew(0deg); opacity: 1;}
        }

        /* floating whispers */
        .creature-whisper {
            font-style: italic;
            color: #ff6a6a;
            animation: floatText 6s ease-in-out infinite;
            display: inline-block;
            text-shadow: 0 0 5px darkred;
            background: rgba(0,0,0,0.5);
            padding: 0 6px;
            border-radius: 40px;
        }

        @keyframes floatText {
            0%,100% { transform: translateY(0px) translateX(0px);}
            50% { transform: translateY(-9px) translateX(4px);}
        }

        /* sticky whisper that follows scroll (haunts the UI) */
        .sticky-whisper {
            position: sticky;
            top: 12px;
            background: rgba(20,0,0,0.85);
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid darkred;
            margin: 12px 0;
            z-index: 30;
            font-family: monospace;
            letter-spacing: 1px;
            width: fit-content;
        }

        /* fade transitions */
        .fade-transition {
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
        }
        .fade-transition.show {
            opacity: 1;
        }

        /* shatter glass ending */
        .shatter-animation {
            animation: glassBreak 0.45s forwards;
        }
        @keyframes glassBreak {
            0% { transform: scale(1); opacity: 1; filter: blur(0);}
            40% { transform: scale(1.08) rotate(1deg); filter: blur(1px); opacity: 0.9;}
            100% { transform: scale(0.7) rotate(4deg); opacity: 0; filter: blur(5px);}
        }

        .hidden { display: none !important; }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 1.8rem;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-family: 'Gabriola', 'Courier New', monospace;
            font-size: 3rem;
            border-left: 4px solid crimson;
            padding-left: 18px;
            margin-bottom: 1rem;
        }

        .scene-image {
            width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            border: 3px solid white;
            border-radius: 20px;
            margin: 0.8rem 0;
            background: #0a0a0a;
            box-shadow: 0 0 8px rgba(255,0,0,0.3);
        }

        .choices {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }
        .choice-btn {
            background: rgba(0,0,0,0.85);
            border: 1.5px solid white;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .choice-btn:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
            border-color: crimson;
        }

        .back-link, .haunted-link {
            background: rgba(0,0,0,0.7);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            color: white;
            border: 1px solid white;
            display: inline-block;
            margin-top: 1rem;
            cursor: pointer;
        }
        .haunted-link {
            color: #ff8888 !important;
            border-color: #ff4d4d !important;
            animation: floatText 3s infinite;
            font-style: italic;
        }

        .gif-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 70px;
            background-color: black;
        }
        .next-btn {
            background: black;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            color: white;
            border: 2px solid white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* clickable hotspot for "Look around" */
        .hotspot-area {
            background: rgba(255,255,200,0.1);
            border-radius: 100px;
            padding: 6px 12px;
            text-align: center;
            font-size: 0.8rem;
            cursor: pointer;
            margin: 6px 0;
            width: fit-content;
            transition: 0.1s;
            border: 1px dashed gray;
        }
        .hotspot-area:hover {
            background: rgba(255,0,0,0.3);
        }

        hr {
            margin: 12px 0;
            border-color: #4a2a2a;
        }
    </style>
</head>
<body>

<div id="gifOverlay" class="gif-overlay hidden">
    <button class="next-btn" id="nextButton">⟡ next ⟡</button>
</div>

<div class="container" id="mainContainer">
    <h1> THE... </h1>
    <div id="scene-start">
        <div class="story-card">
            <img class="scene-image" src="Start.PNG" alt="bathroom entrance">
            <div class="story-text">The door clicks shut. Fluorescent buzz. Your reflection waits.</div>
            <!-- interactive search (look around) -->
            <div class="hotspot-area" id="lookAroundBtn"> Look around the room</div>
            <div id="roomClues" style="font-size:0.9rem; margin-top: 6px; font-style:italic;"></div>
            <div class="choices">
                <button onclick="triggerChoiceWithGif('stare', 'Stare.GIF')" class="choice-btn"> stare intensely</button>
                <button onclick="triggerChoiceWithGif('wash', 'Wash.GIF')" class="choice-btn"> Wash your face</button>
                <button onclick="triggerSensoryChoice()" class="choice-btn"> Touch the glass</button>
            </div>
            <div id="homeLinkDiv"><a href="index.html" class="back-link" id="mainHomeLink">← back to home</a></div>
        </div>
    </div>
    <div id="dynamic-scene" style="display: none;"></div>
</div>

<script>
    let pendingSceneId = null;
    let pendingGif = null;
    let creatureMet = false;
    let dimLevel = 0;

    // ----- subliminal flash (uses Shatter.GIF for 90ms)
    async function subliminalFlash() {
        const overlay = document.getElementById('gifOverlay');
        const originalBg = overlay.style.backgroundImage;
        overlay.style.backgroundImage = "url('Shatter.GIF')";
        overlay.style.backgroundSize = 'cover';
        overlay.classList.remove('hidden');
        await new Promise(r => setTimeout(r, 95));
        overlay.classList.add('hidden');
        overlay.style.backgroundImage = originalBg;
    }

    function triggerChoiceWithGif(sceneId, gifUrl) {
        pendingSceneId = sceneId;
        pendingGif = gifUrl;
        const overlay = document.getElementById('gifOverlay');
        overlay.style.backgroundImage = `url('${gifUrl}')`;
        overlay.style.backgroundSize = 'cover';
        overlay.classList.remove('hidden');
        // subliminal flash on choice click (psychological effect)
        if (creatureMet) subliminalFlash();
    }

    function triggerSensoryChoice() {
        const cluesDiv = document.getElementById('roomClues');
        cluesDiv.innerHTML = '<span class="creature-whisper" style="animation:none;"> The glass is warmer than your skin. Your fingertip meets itself — but the timing feels a fraction of a second off. Something is mimicking you.</span>';
        setTimeout(() => {
            cluesDiv.innerHTML += '<div style="margin-top:6px;">— the barrier is thinning —</div>';
        }, 800);
    }

    async function showPendingScene() {
        if (pendingSceneId) {
            if (pendingSceneId === 'talk_to_it_animated') {
                showTalkToItScene();
            } else {
                await subliminalFlash(); // extra glitch before transition
                showScene(pendingSceneId);
            }
            pendingSceneId = null;
            pendingGif = null;
        }
        document.getElementById('gifOverlay').classList.add('hidden');
    }

    async function fadeTransition(callback) {
        const container = document.getElementById('mainContainer');
        container.classList.add('fade-transition');
        container.classList.remove('show');
        await new Promise(r => setTimeout(r, 380));
        callback();
        container.classList.add('show');
        await new Promise(r => setTimeout(r, 280));
        container.classList.remove('fade-transition');
    }

    function applyHauntUI() {
        if (!creatureMet) return;
        const homeLink = document.getElementById('dynamic-scene')?.querySelector('.back-link') || document.getElementById('mainHomeLink');
        if (homeLink && !homeLink.classList.contains('haunted-link')) {
            homeLink.innerText = " you can't go back ";
            homeLink.classList.add('haunted-link');
        }
    }

    function applyDimming() {
        dimLevel += 0.1;
        const card = document.querySelector('#dynamic-scene .story-card');
        if (card) card.style.backgroundColor = `rgba(0, 0, 0, ${Math.min(0.88 + dimLevel * 0.5, 0.98)})`;
        document.body.style.backgroundColor = `rgba(0, 0, 0, ${Math.min(0.3 + dimLevel * 0.4, 0.95)})`;
    }
    function resetDimming() { dimLevel = 0; document.body.style.backgroundColor = 'black'; }

    function addShakeToImage() {
        const img = document.querySelector('#dynamic-scene .scene-image, #scene-start .scene-image');
        if (img) { img.classList.add('shake-effect'); setTimeout(() => img.classList.remove('shake-effect'), 450); }
    }

    // expanded "ignore" path with sticky whisper
    function showScene(sceneId) {
        fadeTransition(() => {
            const dynamicDiv = document.getElementById('dynamic-scene');
            const startDiv = document.getElementById('scene-start');
            if (startDiv) startDiv.style.display = 'none';
            dynamicDiv.style.display = 'block';
            resetDimming();

            let html = '';
            if (sceneId === 'stare') {
                html = `<div class="story-card"><img class="scene-image" src="Stare.GIF"><div class="story-text">You lock eyes. The reflection doesn't blink first.</div><div class="story-text"><span class="creature-whisper">"I'm watching you"</span></div><div class="choices"><button onclick="triggerChoiceWithGif('look_for_it', '9.gif')" class="choice-btn">🔍 look for it</button><button onclick="triggerChoiceWithGif('talk_to_it_animated', null)" class="choice-btn"> talk to it</button></div><button onclick="resetToStart()" class="back-link">↺ start over</button></div>`;
                setTimeout(() => addShakeToImage(), 80);
                creatureMet = true;
            } 
            else if (sceneId === 'wash') {
                html = `<div class="story-card"><img class="scene-image" src="Wash.GIF"><div class="story-text">Water runs. When you look up, the mirror image wipes its face a second later.</div><div class="story-text"><span class="creature-whisper">"I'm following you"</span></div><div class="choices"><button onclick="triggerChoiceWithGif('look_for_it', '9.gif')" class="choice-btn"> look for it</button><button onclick="triggerChoiceWithGif('talk_to_it_animated', null)" class="choice-btn"> talk to it</button></div><button onclick="resetToStart()" class="back-link">↺ start over</button></div>`;
                creatureMet = true;
            }
            else if (sceneId === 'look_for_it') {
                html = `<div class="story-card"><img class="scene-image" src="9.gif"><div class="story-text">You search corners, shadows. But the voice curls behind your ear.</div><div class="story-text"><span class="creature-whisper">"no... it's not going to be that easy to find me"</span></div><div class="choices"><button onclick="triggerChoiceWithGif('talk_to_it_animated', null)" class="choice-btn"> talk to it</button><button onclick="triggerChoiceWithGif('ignore_after_look', 'Ignore.GIF')" class="choice-btn"> Ignore it</button></div><button onclick="resetToStart()" class="back-link">↺ start over</button></div>`;
            }
            else if (sceneId === 'ignore_after_look' || sceneId === 'ignore_after_talk') {
                html = `<div class="story-card"><img class="scene-image" src="TVEatSleep.PNG"><div class="story-text">You try to live normally. But it never leaves.</div>
                <div class="sticky-whisper"> "I'm still here, watching the same screen..."</div>
                <div class="story-text"> watching TV → <span class="creature-whisper">"I love this show"</span></div>
                <div class="story-text"> eating broccoli → <span class="creature-whisper">"I hate broccoli"</span></div>
                <div class="story-text"> falling asleep → <span class="creature-whisper">"don't worry I'll watch over you"</span></div>
                <div class="choices"><button onclick="triggerChoiceWithGif('accept_reality', 'StareFinale.GIF')" class="choice-btn">✅ except this reality</button><button onclick="triggerChoiceWithGif('panic_end', 'Shatter.GIF')" class="choice-btn"> Panic</button></div><button onclick="resetToStart()" class="back-link">↺ start over</button></div>`;
            }
            else if (sceneId === 'accept_reality') {
                html = `<div class="story-card"><img class="scene-image" src="BangHead.PNG"><div class="story-text">You accept. The voice follows forever. One morning you bang your head against the mirror until it cracks.</div><div class="story-text" style="color:#b77;">✦ THE END — THE MIRROR KEEPS YOUR SHADOW ✦</div><button onclick="resetToStart()" class="choice-btn">↺ play again</button><div style="margin-top:1rem;"><a href="index.html" class="back-link"> home</a></div></div>`;
                setInterval(() => { const img = document.querySelector('#dynamic-scene .scene-image'); if (img) img.classList.add('shake-effect'); setTimeout(() => img?.classList.remove('shake-effect'), 300); }, 2100);
            }
            else if (sceneId === 'panic_end') {
                html = `<div class="story-card" id="shatterCard"><img class="scene-image" src="Shatter.PNG"><div class="story-text">You scream. The reflection snarls and shatters the glass — pulling you through.</div><div class="story-text" style="color:red;">✦ THE END — YOU ARE NOW THE REFLECTION ✦</div><button onclick="resetToStart()" class="choice-btn">↺ restart</button><div><a href="index.html" class="back-link"> home</a></div></div>`;
                setTimeout(() => { const img = document.querySelector('#dynamic-scene .scene-image'); if (img) img.classList.add('shatter-animation'); }, 100);
            }
            else if (sceneId === 'stare_at_yourself') {
                html = `<div class="story-card"><img class="scene-image" src="StareEnd.PNG"><div class="story-text">You stare at your own hollow eyes. then bang your head on the mirror. "be quiet."</div><div class="story-text" style="color:#a55;">✦ THE END — SILENCE AT LAST ✦</div><button onclick="resetToStart()" class="choice-btn">↺ play again</button><div><a href="index.html" class="back-link"> home</a></div></div>`;
            }
            dynamicDiv.innerHTML = html;
            if (creatureMet) applyHauntUI();
            window.scrollTo({ top: 0 });
        });
    }

    // expanded talk to it dialogue (psychological depth + shared space)
    function showTalkToItScene() {
        fadeTransition(() => {
            const dynamicDiv = document.getElementById('dynamic-scene');
            const startDiv = document.getElementById('scene-start');
            if (startDiv) startDiv.style.display = 'none';
            dynamicDiv.style.display = 'block';
            resetDimming();
            const dialogue = [
                { speaker: "You", text: "why, what did I ever do to you", style: "" },
                { speaker: "It", text: "nothing, you want me to follow you", style: "creepy" },
                { speaker: "You", text: "Who are you?", style: "" },
                { speaker: "It", text: "The one who stayed when you looked away.", style: "glitch" },
                { speaker: "You", text: "I'm alone in here.", style: "" },
                { speaker: "It", text: "Are you? Then why are you still acting for me?", style: "creepy" },
                { speaker: "You", text: "No I don't. please stop", style: "" },
                { speaker: "It", text: "I can't… You want — need me to follow you", style: "glitch" },
                { speaker: "You", text: "…", style: "silence" }
            ];
            const containerHtml = `<div class="story-card" id="talkSceneCard"><div class="story-text"> The air freezes. You speak to the mirror.</div><div id="typewriterContainer" style="min-height:320px;"></div><div id="postChoices" style="display: none;"><div class="choices"><button onclick="triggerChoiceWithGif('ignore_after_talk', 'Ignore.GIF')" class="choice-btn">🙉 ignore it</button><button onclick="triggerChoiceWithGif('stare_at_yourself', 'StareFinale.GIF')" class="choice-btn">🪞 Stare at yourself</button></div></div><button onclick="resetToStart()" class="back-link">↺ start over</button></div>`;
            dynamicDiv.innerHTML = containerHtml;
            creatureMet = true;
            applyHauntUI();
            let idx = 0;
            const container = document.getElementById('typewriterContainer');
            const choicesDiv = document.getElementById('postChoices');

            function typeLine(lineObj) {
                const p = document.createElement('p');
                p.classList.add('typewriter-line');
                p.style.margin = '0.7rem 0';
                p.innerHTML = `<strong style="color:${lineObj.speaker === 'It' ? '#c66' : '#eee'}">${lineObj.speaker}:</strong> “${lineObj.text}”`;
                if (lineObj.speaker === "It") p.style.fontFamily = "monospace";
                if (lineObj.style === "glitch") p.classList.add('glitch-text');
                container.appendChild(p);
                applyDimming();
                if (lineObj.text.includes("can't")) setTimeout(() => p.classList.add('shake-effect'), 40);
                if (lineObj.speaker === "It") p.style.animation = "floatText 5s ease-in-out";
                idx++;
                if (idx < dialogue.length) setTimeout(() => typeLine(dialogue[idx]), 1200);
                else choicesDiv.style.display = 'block';
            }
            setTimeout(() => typeLine(dialogue[0]), 200);
            window.scrollTo({ top: 0 });
        });
    }

    function resetToStart() {
        fadeTransition(() => {
            const dynamicDiv = document.getElementById('dynamic-scene');
            const startDiv = document.getElementById('scene-start');
            dynamicDiv.style.display = 'none';
            dynamicDiv.innerHTML = '';
            if (startDiv) startDiv.style.display = 'block';
            creatureMet = false;
            resetDimming();
            const homeLink = document.getElementById('mainHomeLink');
            if (homeLink) { homeLink.innerText = "← back to home"; homeLink.classList.remove('haunted-link'); }
            const clues = document.getElementById('roomClues');
            if (clues) clues.innerHTML = '';
            window.scrollTo({ top: 0 });
        });
    }

    document.getElementById('nextButton').addEventListener('click', showPendingScene);
    setInterval(() => { if (creatureMet) { applyHauntUI(); } }, 2800);

    // Look around mechanic: interactive search
    document.getElementById('lookAroundBtn')?.addEventListener('click', () => {
        const cluesDiv = document.getElementById('roomClues');
        if (!cluesDiv) return;
        const cluesList = [
            " The toothbrush is dry. No one has used it in days.",
            " The mirror has a faint smudge... from the inside.",
            " Water stains form letters you can't quite read.",
            " Time feels wrong — the second hand on the clock jumps backward."
        ];
        const randomClue = cluesList[Math.floor(Math.random() * cluesList.length)];
        cluesDiv.innerHTML = `<span class="creature-whisper" style="background:black;"> ${randomClue}</span>`;
        if (!creatureMet && (randomClue.includes("inside") || randomClue.includes("wrong"))) {
            cluesDiv.innerHTML += `<div style="margin-top:5px;">— something is off —</div>`;
        }
    });
</script>
</body>
</html>
